<div class="bg-primary text-white p-2">
  <div class="container-fluid" style="width: 80%">
    <div class="d-flex align-items-center justify-content-between">

      <div class="d-flex align-items-center">
        <mat-icon class="text-white me-2">public</mat-icon>
        <h5 class="mb-0 fw-bold">Information platform</h5>
      </div>

<!--      <div class="ms-1 flex-grow-0" style="max-width: 250px;">-->
<!--        <div class="input-group">-->
<!--          <input type="text" class="form-control" placeholder="Поиск...">-->
<!--          <button class="btn btn-light" type="button">-->
<!--            <mat-icon>search</mat-icon>-->
<!--          </button>-->
<!--        </div>-->
<!--      </div>-->

      <div class="position-relative" *ngIf="isAuthenticated">
        <button mat-icon-button class="text-white" [matMenuTriggerFor]="userMenu">
          <mat-icon>person</mat-icon>
        </button>
        <mat-menu #userMenu="matMenu" class="mt-2">
          <button mat-menu-item [routerLink]="['users',currentUser?.id,'profile']">
            <mat-icon>account_circle</mat-icon>
            <span>Профиль</span>
          </button>
          <mat-divider></mat-divider>
          <button mat-menu-item (click)="onLogoutButtonClick()">
            <mat-icon>logout</mat-icon>
            <span>Выйти</span>
          </button>
        </mat-menu>
      </div>
      <div class="position-relative" *ngIf="!isAuthenticated">
        <button mat-stroked-button
                color="accent"
                routerLink="/login"
                class="text-white d-flex align-items-center gap-1">
          <mat-icon style="font-size: 18px;">login</mat-icon>
          <span>Войти</span>
        </button>
      </div>

    </div>
  </div>
</div>

<div class="d-flex justify-content-center">

  <div class="d-flex m-0" style="max-width: 80%; width: 100%;">
    <div class="d-flex gap-2" style="width: 20%">
      <mat-nav-list>

        <a mat-list-item routerLink="" (click)="onToggleMenuClick()" routerLinkActive="active" class="align-items-center p-2 gap-2">
          <mat-icon matListItemIcon>home</mat-icon>
          <span matListItemTitle>Главная</span>
        </a>

        <a mat-list-item [routerLink]="['users',currentUser?.id,'profile']" (click)="onToggleMenuClick()" routerLinkActive="active" class="align-items-center p-2 gap-2" *ngIf="isAuthenticated">
          <mat-icon matListItemIcon>person</mat-icon>
          <span matListItemTitle>Моя страница</span>
        </a>

        <a mat-list-item [routerLink]="['users',currentUser?.id,'chats']" (click)="onToggleMenuClick()" routerLinkActive="active" class="align-items-center p-2 gap-2" *ngIf="isAuthenticated">
          <mat-icon matListItemIcon>chat</mat-icon>
          <span matListItemTitle>Чаты</span>
        </a>

        <mat-divider></mat-divider>

      </mat-nav-list>
    </div>
    <div class="d-flex justify-content-center h-100 mt-3" style="width: 80%">
      <router-outlet></router-outlet>
    </div>
  </div>

</div>
