<div class="bg-primary text-white p-2">
  <div class="container-fluid" style="max-width: 80%">
    <div class="d-flex align-items-center justify-content-between">

      <div class="d-flex align-items-center">
        <mat-icon class="text-white me-2">public</mat-icon>
        <h5 class="mb-0 fw-bold">Information platform</h5>
      </div>

      <div class="ms-1 flex-grow-0" style="max-width: 250px;">
        <div class="input-group">
          <input type="text" class="form-control" placeholder="Поиск...">
          <button class="btn btn-light" type="button">
            <mat-icon>search</mat-icon>
          </button>
        </div>
      </div>

      <div class="position-relative" *ngIf="isAuthenticated">
        <button mat-icon-button class="text-white" [matMenuTriggerFor]="userMenu">
          <mat-icon>person</mat-icon>
        </button>
        <mat-menu #userMenu="matMenu" class="mt-2">
          <button mat-menu-item>
            <mat-icon>account_circle</mat-icon>
            <span>Профиль</span>
          </button>
          <button mat-menu-item>
            <mat-icon>settings</mat-icon>
            <span>Настройки</span>
          </button>
          <mat-divider></mat-divider>
          <button mat-menu-item>
            <mat-icon>logout</mat-icon>
            <span>Выйти</span>
          </button>
        </mat-menu>
      </div>
      <div class="position-relative" *ngIf="!isAuthenticated">
        <a mat-list-item routerLink="/login" (click)="onToggleMenuClick()" routerLinkActive="active" class="align-items-center p-2 gap-2">
          <mat-icon matListItemIcon>login</mat-icon>
          <span matListItemTitle>Войти</span>
        </a>
      </div>

    </div>
  </div>
</div>

<div class="d-flex justify-content-center">
  <div class="row m-0" style="max-width: 80%">
    <div class="gap-2 col-2">
      <mat-nav-list>

        <a mat-list-item routerLink="/home" (click)="onToggleMenuClick()" routerLinkActive="active" class="align-items-center p-2 gap-2">
          <mat-icon matListItemIcon>home</mat-icon>
          <span matListItemTitle>Главная</span>
        </a>

        <a mat-list-item routerLink="/profile" (click)="onToggleMenuClick()" routerLinkActive="active" class="align-items-center p-2 gap-2" *ngIf="isAuthenticated">
          <mat-icon matListItemIcon>person</mat-icon>
          <span matListItemTitle>Моя страница</span>
        </a>

        <a mat-list-item routerLink="/chats" (click)="onToggleMenuClick()" routerLinkActive="active" class="align-items-center p-2 gap-2" *ngIf="isAuthenticated">
          <mat-icon matListItemIcon>chat</mat-icon>
          <span matListItemTitle>Чаты</span>
        </a>

<!--        <a mat-list-item routerLink="/friends" (click)="onToggleMenuClick()" routerLinkActive="active" class="align-items-center p-2 gap-2">-->

<!--          <mat-icon matListItemIcon>settings</mat-icon>-->
<!--          <span matListItemTitle>Настройки</span>-->
<!--        </a>-->

        <mat-divider></mat-divider>

<!--        <a mat-list-item routerLink="/quit" (click)="onToggleMenuClick()" routerLinkActive="active" class="align-items-center p-2 gap-2">-->
<!--          <mat-icon matListItemIcon>logout</mat-icon>-->
<!--          <span matListItemTitle>Выйти</span>-->
<!--        </a>-->

      </mat-nav-list>
    </div>
    <div class="d-flex justify-content-center h-100 mt-3 col-10">
      <router-outlet></router-outlet>
    </div>
  </div>

</div>
