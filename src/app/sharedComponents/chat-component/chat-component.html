<div class="border rounded d-flex flex-column h-100" style="width: 600px;" *ngIf="chat !== null">

  <div class="p-3 border-bottom bg-light">
    <h5 class="mb-0">Чат {{calculateMessageTitle()}}</h5>
  </div>

  <div #messagesContainer class="p-3 overflow-auto flex-grow-1 bg-light">
    <app-message-component
      *ngFor="let msg of chat?.messages"
      [message]="msg"
      [isMyMessage]="isCurrentUserMessage(msg)">
    </app-message-component>
  </div>

  <div class="p-3 border-top">
    <div class="input-group">
      <input
        type="text"
        class="form-control"
        [(ngModel)]="newMessageText"
        placeholder="Введите сообщение..."
        (keydown.enter)="onSendMessageClick()"
      >
      <button class="btn btn-primary d-flex align-items-center justify-content-center"
              type="button"
              (click)="onSendMessageClick()"
              style="width: 47px;">
        <mat-icon>send</mat-icon>
      </button>
    </div>
  </div>

</div>

<div class="border rounded d-flex flex-column h-100 justify-content-center align-items-center" style="width: 600px;" *ngIf="chat===null">

  <div class="text-center p-5">
    <div class="mb-4">
      <mat-icon class="display-1 text-muted" style="font-size: 64px; width: 64px; height: 64px;">
        chat
      </mat-icon>
    </div>

    <h3 class="text-muted mb-3">Выберите чат</h3>

    <p class="text-muted mb-4">
      Выберите чат из списка слева чтобы начать общение
    </p>

    <div class="text-muted d-flex align-items-center justify-content-center">
      <mat-icon>arrow_back</mat-icon>
      <small>Чат слева</small>
    </div>
  </div>

</div>
