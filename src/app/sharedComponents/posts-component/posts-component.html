<div class="container">

  <div class="row row-cols-1 g-4 d-flex justify-content-center">

    <div class="p-3 border-bottom bg-light" style="width: 600px">
      <div class="d-flex justify-content-between align-items-center">
        <h5 class="mb-0 fw-bold">Посты</h5>
        <button mat-raised-button color="primary" (click)="onAddPostButtonClick()" class="d-flex align-items-center gap-1" *ngIf="isCreateButtonEnabled">
          <mat-icon style="font-size: 18px;">add</mat-icon>
          <span>Создать</span>
        </button>
      </div>
    </div>

    <div class="col" *ngFor="let post of posts">
      <app-post-component
        (click)="onCommentsButtonClick()"
        [post]="post"
        (postDeleted)="onPostDeleted($event)"
      ></app-post-component>
    </div>
  </div>

</div>
