<div class="row" style="height: calc(100vh - 80px)">

  <div class="col-4 overflow-auto h-100" style="width: 300px;">

    <div class="p-3 border-bottom bg-light" *ngIf="chats.length > 0">

      <div class="d-flex justify-content-between align-items-center">
        <h5 class="mb-0 fw-bold">Чаты</h5>
        <button mat-raised-button color="primary" (click)="onAddChatButtonClick()" class="d-flex align-items-center gap-1">
          <mat-icon style="font-size: 18px;">add</mat-icon>
          <span>Новый</span>
        </button>
      </div>

    </div>

    <div class="mt-3">
      <mat-form-field class="w-100" appearance="outline">
        <mat-label>Поиск чатов</mat-label>
        <input matInput
               [(ngModel)]="searchQuery"
               (input)="onChangeSearchQuery()"
               placeholder="Введите название чата...">
        <mat-icon matSuffix>search</mat-icon>
      </mat-form-field>
    </div>

    <div
      *ngFor="let chat of orderByLastUsage(filteredChats)"
      (click)="onChatClick(chat)"
      [class.bg-primary]="selectedChat?.id === chat.id"
      [class.text-white]="selectedChat?.id === chat.id"
      class="card mb-2 border-0 shadow-sm cursor-pointer"
      style="cursor: pointer;"
    >

      <div class="card-body p-3">
        <div class="d-flex justify-content-between align-items-start mb-2">
          <h6 class="card-title mb-0 fw-semibold text-truncate me-2">
            {{calculateMessageTitle(chat?.id || '')}}
          </h6>
          <small [class.text-white-50]="selectedChat?.id === chat.id"
                 [class.text-muted]="selectedChat?.id !== chat.id">
            {{formatMessageTime(calculateLastMessageDate(chat?.id || '') || '')}}
          </small>
        </div>

        <p class="card-text mb-2 text-truncate small"
           [class.text-white-50]="selectedChat?.id === chat.id"
           [class.text-muted]="selectedChat?.id !== chat.id">
          {{calculateMessageText(chat?.id || '')}}
        </p>

      </div>
    </div>

    <div *ngIf="chats.length === 0" class="text-center p-5 text-muted">
      <mat-icon class="mb-3 opacity-50" style="font-size: 48px;">forum</mat-icon>
      <p class="mb-3">Чатов пока нет</p>
      <button mat-raised-button color="primary" (click)="onAddChatButtonClick()">
        Создать первый чат
      </button>
    </div>

    <div *ngIf="chats.length > 0 && filteredChats.length === 0" class="text-center p-4 text-muted">
      <mat-icon class="mb-2 opacity-50">search_off</mat-icon>
      <p class="mb-0">Чаты не найдены</p>
    </div>

  </div>


  <div class="col-8 h-100">
    <app-chat-component [chat]="selectedChat">

    </app-chat-component>
  </div>
</div>

<app-notification-component
  *ngIf="isShowNotification"
  [message]="notificationMessage"
  [status]="notificationStatus"
  [autoClose]="true"
  [duration]="2000"
  (closed)="onNotificationClosed()">
</app-notification-component>
