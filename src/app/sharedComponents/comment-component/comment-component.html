<mat-card>

  <mat-card-header>
    <mat-card-title>{{comment?.createdBy?.firstName}} {{comment?.createdBy?.lastName}}</mat-card-title>
    <mat-card-subtitle>{{comment?.createdAt}}</mat-card-subtitle>
  </mat-card-header>

  <mat-card-content>
    <p class="mb-3">
      {{comment?.text}}
    </p>
  </mat-card-content>

</mat-card>
