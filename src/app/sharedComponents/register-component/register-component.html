<div class="container d-flex justify-content-center align-items-center vh-100">

  <mat-card style="max-width: 600px; min-width: 600px" class="p-4 shadow-sm">

    <mat-card-header class="pb-3">
      <div class="d-flex align-items-center w-100">
        <div class="bg-primary rounded-circle d-flex align-items-center justify-content-center me-3 flex-shrink-0"
             style="width: 50px; height: 50px;">
          <mat-icon class="text-white" style="font-size: 24px;">person_add</mat-icon>
        </div>
        <div class="flex-grow-1">
          <mat-card-title class="mb-0 fw-bold" style="font-size: 18px;">
            Регистрация
          </mat-card-title>
        </div>
      </div>
    </mat-card-header>

    <mat-card-content>
      <mat-vertical-stepper #stepper class="bg-transparent">
        <mat-step [stepControl]="personalForm">
          <form [formGroup]="personalForm">
            <ng-template matStepLabel>Личные данные</ng-template>

            <mat-form-field class="w-100 mb-3 mt-3">
              <mat-label>Имя</mat-label>
              <input matInput formControlName="firstName" required placeholder="Введите имя">
            </mat-form-field>

            <mat-form-field class="w-100 mb-3">
              <mat-label>Фамилия</mat-label>
              <input matInput formControlName="lastName" required placeholder="Введите фамилию">
            </mat-form-field>

            <div class="d-flex justify-content-end">
              <button mat-raised-button color="primary" matStepperNext [disabled]="personalForm.invalid">Далее</button>
            </div>
          </form>
        </mat-step>

        <mat-step [stepControl]="accountForm">
          <form [formGroup]="accountForm">
            <ng-template matStepLabel>Учётные данные</ng-template>

            <mat-form-field class="w-100 mb-3 mt-3">
              <mat-label>Имя пользователя</mat-label>
              <input matInput formControlName="username" required placeholder="Введите имя пользователя">
            </mat-form-field>

            <mat-form-field class="w-100 mb-3">
              <mat-label>Пароль</mat-label>
              <input matInput formControlName="password" type="password" required placeholder="Введите пароль">
            </mat-form-field>

            <mat-form-field class="w-100 mb-3">
              <mat-label>Повторите пароль</mat-label>
              <input matInput formControlName="confirmPassword" type="password" required placeholder="Повторите пароль">
            </mat-form-field>

            <div class="d-flex justify-content-between align-items-center">
              <button mat-button matStepperPrevious>Назад</button>
              <button mat-raised-button color="primary" (click)="onSubmit()" [disabled]="accountForm.invalid">
                Зарегистрироваться
              </button>
            </div>

          </form>
        </mat-step>
      </mat-vertical-stepper>

      <div class="text-center mt-3">
        <small>
          Уже есть аккаунт? <a routerLink="/login">Войти</a>
        </small>
      </div>

    </mat-card-content>

  </mat-card>

</div>

<app-notification-component
  *ngIf="isShowNotification"
  [message]="notificationMessage"
  [status]="notificationStatus"
  [autoClose]="true"
  [duration]="2000"
  (closed)="onNotificationClosed()">
</app-notification-component>
