<div class="position-fixed top-0 start-50 translate-middle-x mt-4" style="z-index: 1050;">
  <div class="alert alert-dismissible fade show shadow" role="alert" [class]="getAlertClasses()">
    <div class="d-flex align-items-center">
      <mat-icon class="me-3">{{ getStatusIcon() }}</mat-icon>
      <div class="flex-grow-1">
        <strong class="me-2">{{ getStatusTitle() }}</strong>
        {{ message }}
      </div>
      <button type="button" class="btn-close" (click)="onClose()"></button>
    </div>
  </div>
</div>
