<mat-card style="max-width: 600px" class="mx-auto">

  <mat-card-header>
    <mat-card-title>Иван Иванов</mat-card-title>
    <mat-card-subtitle>2 часа назад</mat-card-subtitle>

    <button mat-icon-button class="ms-auto">
      <mat-icon>more_vert</mat-icon>
    </button>
    <mat-menu>
      <button mat-menu-item>
        <mat-icon>delete</mat-icon>
        <span>Удалить</span>
      </button>
    </mat-menu>
  </mat-card-header>

  <mat-card-content>
    <p class="mb-3">
      Это пример текста поста. Здесь пользователь делится своими мыслями, новостями или интересной информацией.
    </p>
  </mat-card-content>

  <mat-card-actions class="d-flex justify-content-between align-items-center px-3">
    <div class="d-flex gap-3">
      <button mat-button color="primary">
        <mat-icon>thumb_up</mat-icon>
        125
      </button>
      <button mat-button color="primary" (click)="onCommentsButtonClick()">
        <mat-icon>comment</mat-icon>
        23
      </button>
    </div>
  </mat-card-actions>


  <app-comments-component *ngIf="isCommentsExpanded"></app-comments-component>
</mat-card>
