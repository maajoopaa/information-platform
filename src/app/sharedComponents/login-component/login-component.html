<div class="container d-flex justify-content-center align-items-center vh-100">

  <mat-card style="max-width: 600px; min-width: 600px" class="p-4 shadow-sm">

    <mat-card-header class="pb-3">
      <div class="d-flex align-items-center w-100">

        <div class="bg-primary rounded-circle d-flex align-items-center justify-content-center me-3 flex-shrink-0"
             style="width: 50px; height: 50px;">
          <mat-icon class="text-white" style="font-size: 24px;">person</mat-icon>
        </div>

        <div class="flex-grow-1">
          <mat-card-title class="mb-0 fw-bold" style="font-size: 18px;">
            Вход в систему
          </mat-card-title>
        </div>

      </div>
    </mat-card-header>

    <mat-card-content>
      <form #loginForm="ngForm" (ngSubmit)="onSubmit()">

        <mat-form-field class="w-100 mb-3">
          <mat-label>Имя пользователя</mat-label>
          <input matInput type="text" name="username" [(ngModel)]="username" required placeholder="Введите имя пользователя">
        </mat-form-field>

        <mat-form-field class="w-100 mb-3">
          <mat-label>Пароль</mat-label>
          <input matInput type="password" name="password" [(ngModel)]="password" required placeholder="Введите пароль">
        </mat-form-field>

        <button mat-raised-button color="primary" class="w-100" [disabled]="loginForm.invalid">
          Войти
        </button>
      </form>

      <div class="text-center mt-3">
        <small>
          Нет аккаунта? <a routerLink="/register">Зарегистрироваться</a>
        </small>
      </div>
    </mat-card-content>

  </mat-card>
</div>
